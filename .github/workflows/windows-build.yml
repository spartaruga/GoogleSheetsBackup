name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned Node version
        id: runtime
        shell: pwsh
        run: |
          $runtime = Get-Content scripts/runtime.json -Raw | ConvertFrom-Json
          "node=$($runtime.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm

      - name: Install and verify source
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          npm run check:repo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          npm run self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag/version mismatch"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }

      - name: Build and package
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          npm run installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          npm run source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install, upgrade and uninstall smoke test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-smoke.ps1

          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GoogleWorkspaceBackup-release
          path: release/*
          if-no-files-found: error
