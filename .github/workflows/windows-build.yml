name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned tool versions
        id: runtime
        run: |
          $runtime = Get-Content scripts/runtime.json -Raw | ConvertFrom-Json
          "node=$($runtime.version)" >> $env:GITHUB_OUTPUT
          "inno=$($runtime.innoVersion)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm

      - name: Install and verify source
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:repo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }

      - name: Install pinned Inno Setup
        run: choco install innosetup --version=${{ steps.runtime.outputs.inno }} --yes --no-progress --allow-downgrade

      - name: Build and package
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install, upgrade and uninstall smoke test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: GoogleWorkspaceBackup-release
          path: release/*
          if-no-files-found: error
